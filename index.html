<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Queue Master Pro</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
    <script>
      tailwind.config = {
        theme: {
          extend: {
            fontFamily: {
              sans: ['Inter', 'sans-serif'],
              mono: ['JetBrains Mono', 'monospace'],
            },
            colors: {
              brand: {
                50: '#eff6ff',
                100: '#dbeafe',
                500: '#3b82f6',
                600: '#2563eb', // Enterprise Blue
                700: '#1d4ed8',
                800: '#1e40af',
                900: '#1e3a8a',
              },
              slate: {
                850: '#1e293b', // Custom dark for headers
              }
            },
            boxShadow: {
              'card': '0 1px 3px 0 rgba(0, 0, 0, 0.1), 0 1px 2px 0 rgba(0, 0, 0, 0.06)',
              'action': '0 4px 6px -1px rgba(37, 99, 235, 0.2), 0 2px 4px -1px rgba(37, 99, 235, 0.1)',
            }
          }
        }
      }
    </script>
    <style>
      body {
        margin: 0;
        padding: 0;
        background-color: #f1f5f9; /* Slate 100 */
        color: #0f172a; /* Slate 900 */
        -webkit-font-smoothing: antialiased;
      }
      
      /* Crisp borders for professional look */
      .pro-border {
        border: 1px solid #e2e8f0;
      }
      
      /* Custom Scrollbar */
      ::-webkit-scrollbar {
        width: 8px;
        height: 8px;
      }
      ::-webkit-scrollbar-track {
        background: #f1f5f9; 
      }
      ::-webkit-scrollbar-thumb {
        background: #cbd5e1; 
        border-radius: 4px;
      }
      ::-webkit-scrollbar-thumb:hover {
        background: #94a3b8; 
      }

      /* Error Logger for TV Debugging */
      #tv-debug-layer {
        display: none;
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        background: rgba(100, 0, 0, 0.9);
        color: white;
        padding: 20px;
        z-index: 9999;
        font-family: monospace;
        font-size: 14px;
        white-space: pre-wrap;
      }
    </style>
<script type="importmap">
{
  "imports": {
    "react": "https://esm.sh/react@^19.2.3",
    "react-dom/": "https://esm.sh/react-dom@^19.2.3/",
    "react/": "https://esm.sh/react@^19.2.3/",
    "express": "https://esm.sh/express@^5.2.1",
    "http": "https://esm.sh/http@^0.0.1-security",
    "socket.io": "https://esm.sh/socket.io@^4.8.3",
    "fs": "https://esm.sh/fs@^0.0.1-security",
    "path": "https://esm.sh/path@^0.12.7",
    "cors": "https://esm.sh/cors@^2.8.6",
    "url": "https://esm.sh/url@^0.11.4",
    "socket.io-client": "https://esm.sh/socket.io-client@^4.8.3",
    "lucide-react": "https://esm.sh/lucide-react@^0.562.0",
    "vite": "https://esm.sh/vite@^7.3.1",
    "@vitejs/plugin-react": "https://esm.sh/@vitejs/plugin-react@^5.1.2",
    "@vitejs/plugin-legacy": "https://esm.sh/@vitejs/plugin-legacy@^7.2.1"
  }
}
</script>
</head>
  <body>
    <div id="tv-debug-layer"></div>
    <div id="root"></div>
    
    <!-- TV Compatibility Error Handler -->
    <script>
      window.onerror = function(message, source, lineno, colno, error) {
        const debug = document.getElementById('tv-debug-layer');
        if (debug) {
          debug.style.display = 'block';
          debug.innerHTML += `[ERROR] ${message} \nAt: ${source}:${lineno}\n\n`;
        }
      };
      window.onunhandledrejection = function(event) {
        const debug = document.getElementById('tv-debug-layer');
        if (debug) {
          debug.style.display = 'block';
          debug.innerHTML += `[PROMISE] ${event.reason}\n\n`;
        }
      };
    </script>

    <script type="module" src="/index.tsx"></script>
  </body>
</html>
